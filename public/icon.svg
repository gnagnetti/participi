<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background with subtle rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner border -->
  <rect x="12" y="12" width="488" height="488" rx="116" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Glowing background circle behind Cyrillic letter -->
  <circle cx="256" cy="256" r="160" fill="url(#roseGrad)" opacity="0.18" filter="url(#glow)"/>

  <!-- Russian Cyrillic "П" for Причастие (Participle) -->
  <g font-family="system-ui, -apple-system, sans-serif" font-weight="900" text-anchor="middle" dominant-baseline="central">
    <!-- Glow layer -->
    <text x="256" y="240" font-size="280" fill="url(#goldGrad)" filter="url(#glow)" opacity="0.4">П</text>
    <!-- Crisp main letter -->
    <text x="256" y="240" font-size="280" fill="url(#goldGrad)">П</text>
  </g>

  <!-- Modern grammatical banner tag at bottom -->
  <g transform="translate(106, 380)">
    <rect width="300" height="48" rx="24" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <text x="150" y="30" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#f8fafc" letter-spacing="4" text-anchor="middle">
      ПРИЧАСТИЯ
    </text>
  </g>
</svg>
